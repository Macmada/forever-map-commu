name: Release

# Pousse un tag (ex. git tag v1.0.0 && git push origin v1.0.0) pour publier une version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive et release.json (WowUp)
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^## Version: .*/## Version: ${V}/" ForeverMap/ForeverMap.toc
          mkdir dist
          zip -r "dist/ForeverMap-${GITHUB_REF_NAME}.zip" ForeverMap
          IFACE="$(sed -n 's/^## Interface: *//p' ForeverMap/ForeverMap.toc | tr -d ' \r' | tr ',' '\n' | sort -n | tail -1)"
          jq -n --arg version "$GITHUB_REF_NAME" --arg file "ForeverMap-${GITHUB_REF_NAME}.zip" --argjson forever "$IFACE" \
            '{releases: [{name: "ForeverMap", version: $version, filename: $file, nolib: false, metadata: [{flavor: "forever", interface: $forever}]}]}' \
            > dist/release.json
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
          printf '\n---\nInstallation : WowUp, « Install from URL » avec https://github.com/Macmada/forever-map\n' >> dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/release.json
          body_path: dist/notes.md
